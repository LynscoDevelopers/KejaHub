<style>
:root{--g:#0b6a2c;--g2:#2e9e4a;--y:#f2b705;--lg:#d3f1d6;--bg:#fff;--tx:#14231a;--mut:#5f6b64;--ln:#e3e8e3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#fff}
@media (min-width:1025px){html,body{background:#dfe5df}}
@supports (height:100dvh){html,body{height:100dvh}}
body{overflow:hidden;overscroll-behavior:none}
body{font:14px/1.35 Poppins,"Trebuchet MS",system-ui,sans-serif;color:var(--tx);display:flex;justify-content:center}
#shell{width:100%;max-width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
#app{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px;max-width:100%}
img,svg,video{max-width:100%}
.hd span,.card b,.card div{overflow-wrap:anywhere}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hd{background:var(--g);color:#fff;display:flex;align-items:center;padding:14px 14px;gap:10px;font-weight:600;font-size:18px;position:sticky;top:0;z-index:5}
.hd span{flex:1;text-align:center}.hd button{background:none;border:0;color:#fff;width:36px;height:36px;padding:0}
.logo{font-weight:800;color:var(--g)}.logo b{color:var(--y)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:2px solid var(--g);background:var(--g);color:#fff;border-radius:30px;padding:12px;font-weight:600;font-size:16px;text-decoration:none;cursor:pointer}
.btn.o{background:#fff;color:var(--g)}.btn.wa{background:#1fa855;border-color:#1fa855}.btn.s{width:auto;padding:7px 14px;font-size:13px;border-radius:20px}
.bd{display:inline-block;background:var(--g2);color:#fff;font-weight:600;font-size:12px;padding:2px 10px;border-radius:8px}
.bd.a{background:#e69a00}.bd.x{background:#8a948d}.bd.l{background:var(--lg);color:var(--g)}
.pad{padding:12px 14px}.mut{color:var(--mut);font-size:12.5px}.price{color:var(--g);font-weight:700}
.img{overflow:hidden;position:relative;background:#bfe3f5}.img svg{width:100%;height:100%;display:block}
.hrt{background:none;border:0;padding:0;font-size:22px;line-height:1;color:#e53935}
.pill{border:1px solid var(--ln);background:#fff;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:500;min-width:0;min-height:36px;white-space:nowrap;text-overflow:ellipsis;appearance:none;-webkit-appearance:none}
.pill.on{background:var(--g);color:#fff;border-color:var(--g)}
.card{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln);cursor:pointer}
.card .img{width:clamp(84px,27vw,104px);height:clamp(84px,27vw,104px);border-radius:12px;flex:none}
.nv{display:flex;border-top:1px solid var(--ln);background:#fff;padding-bottom:env(safe-area-inset-bottom,0px)}
.nv button{flex:1;min-width:0;background:none;border:0;padding:7px 0 6px;font-size:clamp(10px,2.9vw,11px);color:#333;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:500}
.nv button.on{color:var(--g);font-weight:700}.nv button.on svg{fill:var(--g)}
.nv .plus{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:22px;line-height:1}
.dot{position:absolute;top:2px;right:24%;background:#e53935;color:#fff;font-size:10px;border-radius:10px;min-width:16px;height:16px;display:grid;place-items:center;font-weight:700}
.fld label{font-weight:600;font-size:13px}.fld input,.fld select{width:100%;border:1px solid var(--ln);border-radius:8px;padding:10px;margin:3px 0 10px;background:#fff}
.am{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px}.am div{background:var(--lg);color:var(--g);border-radius:10px;padding:8px 2px;text-align:center;font-size:11px;font-weight:500;border:2px solid transparent;cursor:pointer}
.am div.on{border-color:var(--g);background:#b7e6bd}.am div b{display:block;font-size:20px;font-weight:400}
.mi{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--ln);font-weight:500;cursor:pointer}.mi i{font-style:normal;width:22px;text-align:center}.mi u{margin-left:auto;text-decoration:none;color:#888}
.rb{display:flex;align-items:center;justify-content:center;background:#e53935;color:#fff;border-radius:50%;width:20px;height:20px;font-size:11px;font-weight:700;margin-left:auto}
.st{display:flex;align-items:center;gap:8px}.st button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--g);background:#fff;color:var(--g);font-size:18px;font-weight:700;padding:0}
#toast{position:absolute;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);text-align:center;transform:translateX(-50%);background:#14231a;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.fld input[type=checkbox]{width:auto;margin:3px 0}.lnk{color:var(--g);font-weight:700;cursor:pointer}.bk,.hd button.bk{display:grid;place-items:center;width:38px;height:38px;padding:0;border-radius:50%;color:#fff;font-size:20px;line-height:1;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.6);cursor:pointer;transition:transform .15s,background .15s}.bk:hover{background:rgba(255,255,255,.3)}.bk:active{transform:scale(.9)}.bk:focus-visible{outline:3px solid var(--y);outline-offset:2px}.bk.fl{background:var(--g);border-color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}.sw{width:46px;height:26px;border-radius:13px;background:#c5cdc6;position:relative;border:0;flex:none;padding:0;cursor:pointer;transition:background .2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:var(--g)}.sw.on::after{left:23px}#dr{position:absolute;inset:0;z-index:20;display:none}#dr.on{display:block}.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}.pnl{position:absolute;left:0;top:0;bottom:0;width:80%;max-width:320px;background:#fff;display:flex;flex-direction:column;animation:sl .22s ease-out}@keyframes sl{from{transform:translateX(-100%)}}#toast{z-index:30}@media (prefers-reduced-motion:reduce){.pnl{animation:none}}
/* ---- responsive additions ---- */
.fh{display:flex;gap:8px;flex-wrap:wrap}.fh>select.pill{flex:1 1 96px}.fh>button.pill{flex:1 1 auto;min-width:max-content}
.rw{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0 0;font-weight:600}
.wl{min-height:100%;display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden}
.wl .w-hero{position:relative;text-align:center;padding-top:clamp(36px,8vh,60px)}
.wl .w-hero svg{width:clamp(72px,16vh,120px);height:auto}
.wl .w-name{font-size:clamp(38px,13vw,52px);line-height:1}
.wl .w-img{height:clamp(120px,24vh,190px);margin:14px clamp(16px,7vw,28px) 0;border-radius:14px;background:#cfeaf8}
.wl .w-list{padding:clamp(8px,2vh,16px) clamp(20px,8vw,34px) 8px;font-weight:500;line-height:clamp(1.7,.4vh + 1.5,2)}
.wl .w-btns{padding:6px clamp(20px,8vw,34px);display:grid;gap:10px}
@media (max-width:360px){.pad{padding:10px 12px}.card{padding:10px 12px;gap:10px}.btn{font-size:15px;padding:11px}.hd{font-size:17px;padding:12px}}
@media (max-width:340px){.am div{font-size:10.5px}.am div b{font-size:18px}.mi{padding:12px;gap:10px}}
@media (max-height:480px) and (orientation:landscape){.wl .w-hero{padding-top:28px}.nv button{padding:4px 0}}
@media (min-width:1025px){#shell{max-width:720px}}
.wl .w-hero{z-index:1}
@media (min-width:1025px),(min-aspect-ratio:4/7){
.wl{--W:100vw;background-image:none!important}
.wl::before,.wl::after{content:"";position:absolute;left:0;right:0;background:var(--wbg) no-repeat;background-size:100% auto;z-index:0;pointer-events:none}
.wl::before{top:0;height:calc(100% - var(--W)*.35);background-position:center top;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - var(--W)*.15),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - var(--W)*.15),transparent)}
.wl::after{bottom:0;height:calc(var(--W)*.5);background-position:center bottom;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%);mask-image:linear-gradient(to bottom,transparent,#000 30%)}
.wl>div{z-index:1}
.wl>div[style*="bottom:9%"]{bottom:15%!important}
}
@media (min-width:1025px){.wl{--W:720px}}
@media (hover:none){.bk:hover{background:rgba(255,255,255,.18)}}
.ths{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px}.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--lg)}.th img{width:100%;height:100%;object-fit:cover;display:block}.th button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:15px;line-height:1;padding:0;display:grid;place-items:center}.th span{position:absolute;left:4px;bottom:4px;background:var(--g);color:#fff;font-size:10px;font-weight:600;border-radius:10px;padding:1px 7px}.th.add{display:grid;place-items:center;align-content:center;border:2px dashed var(--g2);color:var(--g);font-size:26px;line-height:1;cursor:pointer;background:#fff}.th.add small{font-size:11px;font-weight:600;display:block;text-align:center}
.gal{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gal::-webkit-scrollbar{display:none}.gal img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center;display:block}.gn{position:absolute;bottom:34px;right:12px;background:rgba(0,0,0,.6);color:#fff;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}.gb{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:22px;line-height:1;padding:0;display:grid;place-items:center;color:var(--g)}.gb.l{left:10px}.gb.r{right:10px}
.pmap{position:relative;height:320px;border-radius:12px;overflow:hidden;background:#e5ebe0;touch-action:none;user-select:none;-webkit-user-select:none;border:1px solid var(--ln);cursor:grab}
.pmap .tl{position:absolute;inset:0}.pmap .ti{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pmap .mk{position:absolute;left:0;top:0;width:0;height:0;z-index:3;cursor:grab;touch-action:none}.pmap .mk svg{position:absolute;left:-20px;top:-52px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.pmap .ac{position:absolute;border-radius:50%;background:rgba(255,122,0,.16);border:1.5px solid #ff7a00;z-index:2;pointer-events:none}
.pmap button{border:0;background:#fff;color:#14231a;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer}
.pmap .zb{position:absolute;right:8px;top:8px;z-index:5;display:grid;gap:6px}.pmap .zb button{width:36px;height:36px;border-radius:8px;font-size:22px;line-height:1;padding:0}
.pmap .lt{position:absolute;left:8px;top:8px;z-index:5;display:flex;border-radius:8px;overflow:hidden;box-shadow:0 1px 5px rgba(0,0,0,.35)}.pmap .lt button{padding:8px 12px;font-size:13px;border-radius:0;box-shadow:none}.pmap .lt button.on{background:var(--g);color:#fff}
.pmap .at{position:absolute;right:0;bottom:0;z-index:4;background:rgba(255,255,255,.8);font-size:10px;padding:1px 6px;pointer-events:none}
.pmap .mm{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);z-index:4;background:rgba(255,255,255,.92);border-radius:10px;padding:10px 12px;text-align:center;font-size:13px;pointer-events:none}
.ulc{display:flex;align-items:center;gap:10px;margin:2px 0 10px;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--lg);cursor:pointer}.ulc input{margin:0!important;padding:0!important;width:20px!important;height:20px;flex:none;accent-color:var(--g)}
.btn:disabled{opacity:.6;cursor:default}

/* ---- v2: bigger photo, lightbox, real maps ---- */
.gal{cursor:zoom-in}
.hx{position:absolute;top:58px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer}
.ds{font-size:12.5px;line-height:1.45;color:var(--mut);margin:2px 0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ds.open{display:block}
#lb{position:absolute;inset:0;z-index:30;background:#000;display:none;flex-direction:column}#lb.on{display:flex}
#lb .lt2{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:12px;color:#fff;font-weight:600;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0))}
#lb .ls{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}#lb .ls::-webkit-scrollbar{display:none}
#lb .sl{flex:none;width:100%;height:100%;scroll-snap-align:center;display:flex;overflow:auto;touch-action:pan-x pan-y pinch-zoom}
#lb .sl img{margin:auto;max-width:100%;max-height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
#lb .sl.z img{max-width:none;max-height:none;width:220%;height:auto}
#lb .lh{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.6);font-size:12px;pointer-events:none}
.pmap.pv{touch-action:pan-y}
.pmap .pl{position:absolute;inset:0;z-index:3;pointer-events:none}
.pmap .pin{position:absolute;left:0;top:0;width:0;height:0;pointer-events:auto;cursor:pointer}
.pmap .pin svg{position:absolute;left:-20px;top:-52px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));transform-origin:20px 52px;transition:transform .12s}
.pmap .pin.sel{z-index:2}.pmap .pin.sel svg{transform:scale(1.25)}

/* ---- PWA install banner ---- */
#ins{position:absolute;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:25;display:none;align-items:center;gap:10px;background:#14231a;color:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:13px}
#ins.on{display:flex}#ins img{width:36px;height:36px;border-radius:9px;flex:none}#ins span{flex:1;min-width:0}#ins b{display:block;font-size:14px}
#ins button{border:0;border-radius:18px;padding:8px 14px;font-weight:600;background:var(--y);color:#14231a;cursor:pointer}#ins button.x{background:none;color:#fff;padding:6px 8px;font-size:18px;line-height:1}
@media (display-mode:standalone){#ins{display:none!important}}
/* spacing: menu items fill the available height */
.dl{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.dl .mi{flex:1 1 0;min-height:46px;max-height:84px;padding-top:0;padding-bottom:0}
.pf{min-height:100%;display:flex;flex-direction:column}
.pfl{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.pfl .mi{flex:1 1 0;min-height:48px;max-height:90px;padding-top:0;padding-bottom:0}
.pf .pfb{margin-top:auto!important}
/* auth screens */
.au{min-height:100%;background:#f3f7f3;display:flex;flex-direction:column;padding-bottom:28px}
.ah{background:linear-gradient(160deg,var(--g) 0%,#08501f 100%);color:#fff;padding:16px 20px 66px;border-radius:0 0 34px 34px;border-bottom:5px solid var(--y)}
.ah .tp{display:flex;align-items:center;justify-content:space-between}
.ah .br{display:flex;align-items:center;gap:8px}
.ah .bx{background:#fff;border-radius:11px;padding:4px 5px;display:flex}

.ah p{margin:0;font-size:14px;opacity:.9}

.acd .rc span{display:block;font-size:20px;margin-bottom:2px}

/* ================= DESKTOP / TABLET LAYOUT (>=900px) =================
   Phones keep the original app layout. Wider screens get a sidebar,
   a wider content column and grid listings. */
.sbl{display:none}
@media (min-width:900px){
html,body{background:#eef2ee}
body{justify-content:center}
#shell{max-width:1280px;width:100%;flex-direction:row;box-shadow:0 0 0 1px var(--ln),0 10px 40px rgba(0,0,0,.08)}
/* sidebar navigation (replaces bottom bar) */
.nv{order:-1;flex:none;width:230px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--ln);padding:18px 12px;background:#fff;overflow-y:auto}
.nv .sbl{display:block;padding:4px 8px 18px}
.nv button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;font-size:15px;font-weight:500;padding:12px 14px;border-radius:12px;color:var(--tx);cursor:pointer;text-align:left}
.nv button:hover{background:var(--lg)}
.nv button.on{background:var(--lg);color:var(--g);font-weight:700}
.nv .plus{width:28px;height:28px;font-size:20px}
.nv .dot{position:static;margin-left:auto}
#app{flex:1;min-width:0}
#toast{bottom:28px;left:calc(50% + 115px)}
#ins{left:auto;right:20px;bottom:20px;width:380px}
/* top bars: no back-arrow-only look, keep centred title but limit width */
.hd{padding:16px 28px;font-size:20px}
.hd span{text-align:left}
/* generic page padding for forms/lists */
.pad{padding:18px 32px}
.card{padding:16px 20px}
.card .img{width:132px;height:132px}
.card:hover{background:#f6faf6}
.mi{padding:15px 28px}
/* narrow reading column for forms & settings */
[data-sc=post] #app>.pad,[data-sc=settings] #app>.mi,[data-sc=settings] #app>div{max-width:760px}
[data-sc=post] #app>.pad{margin:0 auto;width:100%}
.am{grid-template-columns:repeat(auto-fit,minmax(96px,1fr))}
/* ---- Home ---- */
[data-sc=home] #app>div:nth-child(2){min-height:340px!important;padding:44px 40px 70px!important}
[data-sc=home] #app>div:nth-child(2)>div:first-child{font-size:clamp(34px,4vw,52px)!important;max-width:48%!important}
[data-sc=home] #app>div:nth-child(2)>div:nth-child(2){font-size:16px!important;max-width:40%!important}
[data-sc=home] #app>div:nth-child(3){max-width:720px;margin:-30px auto 18px!important;padding:7px 7px 7px 22px!important}
[data-sc=home] #app>div:nth-child(4){grid-template-columns:repeat(4,1fr)!important;gap:16px!important;padding:0 40px!important;max-width:980px;margin:0 auto}
[data-sc=home] #app>div:nth-child(4)>div{padding:16px 4px!important;font-size:14px!important;transition:transform .15s,box-shadow .15s}
[data-sc=home] #app>div:nth-child(4)>div:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(11,106,44,.15)}
[data-sc=home] #app>div:nth-child(5){padding:26px 40px 10px!important}
[data-sc=home] #app>div:nth-child(6){gap:16px!important;padding:0 40px!important}
[data-sc=home] #app>div:nth-child(6)>.img{height:150px!important;border-radius:14px!important}
[data-sc=home] #app>div:nth-child(7){margin:22px 40px!important;max-width:520px}
[data-sc=home] #app>div:nth-child(8){padding:6px 40px 30px!important;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:0 24px;align-items:start}
[data-sc=home] #app>div:nth-child(8)>b{grid-column:1/-1;padding:0 0 8px!important;font-size:20px!important}
[data-sc=home] #app>div:nth-child(8)>.card{border:1px solid var(--ln);border-radius:14px;margin-bottom:14px}
[data-sc=home] #app>div:nth-child(8)>.pad{grid-column:1/-1}
/* ---- Search results: card grid ---- */
[data-sc=search] #app{display:flex;flex-direction:column}
[data-sc=search] #app>.hd~.card,[data-sc=search] #app>.hd~.pad.mut{max-width:none}
[data-sc=search] #app{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;align-content:start;column-gap:20px;padding-bottom:24px}
[data-sc=search] #app>.hd,[data-sc=search] #app>.pad,[data-sc=search] #app>div:not(.card){grid-column:1/-1}
[data-sc=search] #app>.card{margin:0 0 0 20px;border:1px solid var(--ln);border-radius:14px;margin-top:14px}
[data-sc=search] #app>.card:nth-of-type(even){margin-left:0;margin-right:20px}
[data-sc=search] #app>.pad[style*="padding-bottom:4px"]{display:grid;grid-template-columns:1fr;gap:0}
.pmap{height:460px}
[data-sc=search] #smap{height:520px!important}
/* ---- Detail: photo left, info right ---- */
[data-sc=detail] #app{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);align-items:start;min-height:100%}
[data-sc=detail] #app>.img{position:sticky;top:0;height:calc(100vh - 0px)!important;min-height:420px}
[data-sc=detail] #app>div:nth-child(2){margin-top:0!important;border-radius:0!important;padding:28px 32px!important;min-height:100%}
#dmap{height:300px!important}
/* ---- Saved / Messages / Profile ---- */
[data-sc=saved] #app>div[style*="grid-template-columns:1fr 1fr"]{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))!important;gap:20px!important;padding:24px 32px!important}
[data-sc=saved] #app .img{height:170px!important}
[data-sc=messages] #app>*:not(.hd),[data-sc=profile] #app>*:not(.hd),[data-sc=listings] #app>*:not(.hd),[data-sc=review] #app>*:not(.hd),[data-sc=settings] #app>*:not(.hd){max-width:820px}
/* ---- Login / signup / welcome: centred card on wide screens ---- */
[data-sc=login] #app,[data-sc=signup] #app{background:#f3f7f3}
.wl{--W:1280px}
/* ---- Menu drawer opens inside the content area ---- */
#dr .pnl{max-width:340px}
/* lightbox photo viewer */
#lb .sl img{max-height:92%}
/* nicer scrollbars on desktop */
#app{scrollbar-width:thin;scrollbar-color:#b9c7bc transparent}
.bk,.card,.mi,.pill,.btn,.nv button,.lnk{cursor:pointer}
/* the hamburger/menu is redundant with the sidebar on wide screens */
[data-sc=home] #app>div:first-child>button:first-child{display:none}
.hd .bk[aria-label=Menu]{display:none}
}
@media (min-width:1500px){
#shell{max-width:1440px}
[data-sc=search] #app{grid-template-columns:repeat(3,minmax(0,1fr))}
[data-sc=search] #app>.card,[data-sc=search] #app>.card:nth-of-type(even){margin-left:20px;margin-right:0}
[data-sc=search] #app>.card:nth-of-type(3n){margin-right:20px}
}
/* narrow tablets: smaller sidebar */
@media (min-width:900px) and (max-width:1100px){.nv{width:84px}.nv button{flex-direction:column;gap:3px;font-size:11px;padding:10px 4px;text-align:center;justify-content:center}.nv .sbl{display:none}.nv .dot{position:absolute;margin:0;right:14px;top:4px}[data-sc=search] #app{grid-template-columns:1fr}[data-sc=search] #app>.card,[data-sc=search] #app>.card:nth-of-type(even){margin:14px 20px 0}[data-sc=detail] #app{grid-template-columns:1fr}[data-sc=detail] #app>.img{position:relative;height:clamp(300px,50vh,480px)!important}}
</style></head><body>
<div id="shell"><div id="app"></div><div id="dr" role="dialog" aria-modal="true" aria-label="Menu"></div><div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer"></div><div class="nv" id="nv"></div><div id="ins" role="dialog" aria-label="Install Bedsitter.co.ke"></div><div id="toast"></div></div>

async function readImgs(inp,arr){const fs=[...inp.files];inp.value="";for(const f of fs){if(arr.length>=MAXI){toast("Maximum "+MAXI+" photos per property");break}if(!f.type.startsWith("image/")){toast("Only image files are allowed");continue}try{arr.push(await shrink(f))}catch(e){toast("Could not read that image")}}}
function drawImgs(){const e=$("#pth");if(e)e.innerHTML=thumbs(S.pimgs,"rmImg(","$('#pf').click()")}
async function addImgs(inp){await readImgs(inp,S.pimgs);drawImgs()}
function rmImg(i){S.pimgs.splice(i,1);drawImgs()}
function pickPImg(id){S.pid=id;$("#pff").click()}
const PMAX=800000,psz=a=>a.reduce((n,d)=>n+d.length,0);

async function rmPImg(id,i){const p=S.props.find(x=>x.id===id);if(!p||!p.imgs)return;const imgs=p.imgs.slice();imgs.splice(i,1);try{await FF.updateDoc(FF.doc(DB,"properties",id),{imgs,updatedAt:FF.serverTimestamp()})}catch(e){fail(e)}}

const logo=(w,x="",lt)=>`<img src="${lt?LOGO_W:LOGO}" alt="Bedsitter.co.ke" width="${w}" style="width:${w}px;max-width:100%;height:auto;display:block;${x}">`;
function title(u,p){return u.label==="Bedsitter"?"Bedsitter":u.label+" "+p.ptype}
function lab(u,d){return u.vacant<=0?["x","Fully occupied"]:d>30?["a","Confirm availability"]:u.vacant<=2?["a","Few left • "+u.vacant]:["","Available • "+u.vacant+" units"]}
function cb(u,d){const l=lab(u,d);return`<span class="bd ${l[0]}">${u.vacant>2&&d<=30?u.vacant+" Vacancies":l[1]}</span>`}
function go(s,a,u){lbClose();if(!["login","signup"].includes(s))S.ret=null;if(["saved","post","listings","messages","profile","review"].includes(s)&&!S.user){toast("Log in to continue");s="login"}if(["post","listings"].includes(s)&&S.user.role!=="manager"){toast("Only property managers can do this");s="home"}if(s==="review"&&!S.admin)s="home";if(s==="signup")S.ro="tenant";if(s==="post"){S.pin=null;S.pimgs=[];S.useLoc=false;S.acc=0}if(s==="settings"){S.from=S.screen==="settings"?S.from:S.screen;S.sec=""}if(s==="messages")markRead();S.screen=s;S.arg=a??null;S.u=u||0;S.edit=0;render();$("#app").scrollTop=0}
function markRead(){const u=S.inq.filter(e=>!e.read);if(!u.length)return;const b=FF.writeBatch(DB);u.forEach(e=>b.update(FF.doc(DB,"enquiries",e.id),{read:true}));b.commit().catch(()=>{})}
async function fav(id){if(!S.user){toast("Log in to save properties");return go("login")}const on=S.favs.includes(id);S.favs=on?S.favs.filter(x=>x!==id):[...S.favs,id];render(1);try{await FF.updateDoc(uref(),{favs:on?FF.arrayRemove(id):FF.arrayUnion(id)})}catch(e){fail(e)}}
function pick(p){let us=p.units.filter(u=>(!S.type||u.label===S.type)&&(!S.max||u.rent<=S.max));if(S.avail)us=us.filter(u=>u.vacant>0);return us.sort((a,b)=>(b.vacant>0)-(a.vacant>0)||a.rent-b.rent)[0]||null}
const bar=(t,back,r)=>`<div class="hd">${back?`<button class="bk" onclick="go('${back}')" aria-label="Back">${BK}</button>`:`<button class="bk" onclick="openMenu()" aria-label="Menu">☰</button>`}<span>${t}</span>${r||'<i style="width:36px"></i>'}</div>`;
const card=(p,u)=>`<div class="card" onclick="go('detail','${p.id}',${p.units.indexOf(u)})"><div class="img">${pimg(p)}</div><div style="flex:1;min-width:0"><div style="display:flex;justify-content:space-between;align-items:center">${cb(u,p.days)}<button class="hrt" aria-label="Save" onclick="event.stopPropagation();fav('${p.id}')">${S.favs.includes(p.id)?"♥":"♡"}</button></div>
<div style="font-weight:700;margin-top:3px">${title(u,p)}</div><div class="mut">📍 ${h(p.estate)}, ${h(p.town)}</div><div class="price">${ksh(u.rent)} / month</div><div class="mut" style="margin-top:2px">🛏 ${u.beds} &nbsp; 🛁 ${u.baths} &nbsp; 🚗 ${u.park}</div></div></div>`;
const pubs=()=>S.props.filter(p=>p.status==="Published");
